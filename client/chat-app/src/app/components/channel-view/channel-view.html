<div class="channel-view">
  <div class="channel-header" *ngIf="selectedChannel">
    <div class="channel-info">
      <h4># {{ selectedChannel.name }}</h4>
      <span class="member-count" *ngIf="onlineMembers > 0">
        {{ onlineMembers }} members online
      </span>
    </div>
  </div>
  
  <div class="messages-container">
    <div class="messages-area" #messagesArea>
      <div class="message-item" *ngFor="let message of messages">
        <div class="message-header">
          <strong class="username">{{ message.username }}:</strong>
          <span class="timestamp" *ngIf="message.timestamp">
            {{ formatTimestamp(message.timestamp) }}
          </span>
        </div>
        <div class="message-content" *ngIf="message.content">{{ message.content }}</div>
        <div class="message-image" *ngIf="message.imageUrl">
          <img [src]="message.imageUrl" alt="Shared image" style="max-width: 300px; border-radius: 8px;">
        </div>
      </div>
      
      <div class="read-indicator" *ngIf="messages.length > 0">
        <em>--- You have read all messages ---</em>
      </div>
    </div>
  </div>
  
  <div class="message-input-container">
    <div class="image-preview" *ngIf="imagePreview">
      <img [src]="imagePreview" alt="Preview" style="max-height: 100px;">
      <button class="btn btn-sm btn-danger" (click)="cancelImageUpload()">✕</button>
    </div>
    <div class="message-input">
      <input 
        type="file" 
        accept="image/*" 
        #fileInput 
        (change)="onImageSelected($event)" 
        style="display: none;">
      <button 
        class="btn btn-secondary" 
        (click)="fileInput.click()"
        [disabled]="uploadingImage"
        title="Upload image">
        📷
      </button>
      <input 
        type="text" 
        class="form-control"
        [(ngModel)]="messageText" 
        placeholder="Type your message..."
        (keyup.enter)="sendMessage()"
        #messageInput>
      <button 
        class="btn btn-primary" 
        (click)="sendMessage()"
        [disabled]="!messageText.trim()">
        Send
      </button>
    </div>
  </div>
</div>
